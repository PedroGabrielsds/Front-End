<head>

    <title>Home</title>

        main {

            /*width: 159px;*/
            /*height: 50px;*/

            top: 77%;
            left: 11%;

        }

        /* Inicio App Ferrari */
        div.app-ferrari {

            top: 17%;
            left: 26.5%;

        }

        div.app-ferrari div.icone-ferrari {
            width: 70%;

            left: 15%;

        div.app-lambo {

            top: 17.3%;

        }

        div.app-lambo div.icone-lambo {

        }

        /* Inicio App Ferrari */
        div.app-porsche {

            outline: 2px solid gray;

        }

</head>
